<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" href="css/style_mobile.css" type="text/css" />
	<script type="text/javascript" src="js/jquery-1.10.1.min.js"></script>
</head>
<title></title>
<body>
	<div class="content">
		<a href="" title="" alt="">
			<div class="menu_icon"></div>
		</a>
		<a href="" title="" alt="">
			<div class="logo">
				<img src="images/logo.png" title="" alt="">
			</div>
		</a>
		<a href="" title="" alt="">
			<div class="bag">
				<div class="bag_num">10</div>
			</div>
		</a>
		<div class="divider" style="margin: 0 0 10px 0;"></div>
		<script>
			$(document).ready(function(){
				$(".button").mousedown(function(){
					$(this).addClass("mousedown");
				});
				$(".button").mouseup(function(){
					$(this).removeClass("mousedown");
				});
				$(".button").mouseleave(function(){
					$(this).removeClass("mousedown");
				});
			});
		</script>
		<div class="centered_text alert_text" style="margin: 20px 0 0 0;">
			Ваш вопрос отправлен!
		</div>
		<div class="left_text2 item_txt" style="margin: 30px 0 20px 80px;">
			Спасибо за ваше время, мы ответим вам в ближайшее время.
		</div>
		<a href="" title="" alt="">
			<div class="button button320px button_text" style="margin: 50px 0 0px 160px;">
				Задать вопрос
			</div>
		</a>
		<div class="divider" style="margin: 10px 0 10px 0;"></div>
	</div>
</body>
</html>
