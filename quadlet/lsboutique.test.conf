<VirtualHost *:80>
        ServerName lsboutique.test
        DocumentRoot /var/www/html
        ServerAdmin webmaster@lsboutique.test
        ServerAlias www.lsboutique.test
        AddType application/x-httpd-php .php .php3 .php4 .php5 .phtml
        AddType application/x-httpd-php-source .phps
        php_admin_value upload_tmp_dir "/tmp"
        php_admin_value session.save_path "/tmp"

        <Location "/files">
                RewriteEngine Off
                ErrorDocument 404 http://lsboutique.ru%{escape:%{REQUEST_URI}}
        </Location>

        <Location "/rest_api">
                ProxyPass http://localhost:4566/
        </Location>
</VirtualHost>
